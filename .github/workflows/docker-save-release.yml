name: Docker Save and Release

on:
  push:
    paths:
      - 'image_x86.txt'
      - 'image_arm.txt'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Target image list file to process (or both)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - image_x86.txt
          - image_arm.txt
      release_tag:
        description: 'Custom Release Tag (leave empty for auto-generated date/run tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Pull, Save and Release Images
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Process Images and Export Files
        id: process
        run: |
          set -euo pipefail

          TARGET_FILE="${{ github.event.inputs.target_file || '' }}"
          EVENT_NAME="${{ github.event_name }}"

          echo "Event: ${EVENT_NAME}, Target File: ${TARGET_FILE}"

          # 准备输出目录和临时文件
          mkdir -p ./dist
          X86_IMAGES=$(mktemp)
          ARM_IMAGES=$(mktemp)

          # 提取清洗后的有效镜像行（过滤注释与空行）
          extract_valid_images() {
            local file="$1"
            if [ -f "$file" ]; then
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$file" \
                | grep -v '^[[:space:]]*$' \
                | grep -v '^[[:space:]]*#' \
                | sort -u || true
            fi
          }

          # 提取 git diff 中新增/修改的行
          extract_diff_images() {
            local file="$1"
            if [ -f "$file" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                DIFF_RES=$(git diff -U0 HEAD~1 HEAD -- "$file" 2>/dev/null \
                  | grep '^\+[^+]' \
                  | sed 's/^\+//' \
                  | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                  | grep -v '^[[:space:]]*$' \
                  | grep -v '^[[:space:]]*#' \
                  | sort -u || true)
                if [ -n "$DIFF_RES" ]; then
                  echo "$DIFF_RES"
                else
                  extract_valid_images "$file"
                fi
              else
                extract_valid_images "$file"
              fi
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_FILE" = "all" ] || [ "$TARGET_FILE" = "image_x86.txt" ]; then
              extract_valid_images "image_x86.txt" > "$X86_IMAGES"
            fi
            if [ "$TARGET_FILE" = "all" ] || [ "$TARGET_FILE" = "image_arm.txt" ]; then
              extract_valid_images "image_arm.txt" > "$ARM_IMAGES"
            fi
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "image_x86.txt image_arm.txt")
            if echo "$CHANGED_FILES" | grep -q "^image_x86.txt$"; then
              extract_diff_images "image_x86.txt" > "$X86_IMAGES"
            fi
            if echo "$CHANGED_FILES" | grep -q "^image_arm.txt$"; then
              extract_diff_images "image_arm.txt" > "$ARM_IMAGES"
            fi
          fi

          TOTAL_X86=$(grep -c . "$X86_IMAGES" || true)
          TOTAL_ARM=$(grep -c . "$ARM_IMAGES" || true)
          TOTAL_IMAGES=$((TOTAL_X86 + TOTAL_ARM))

          echo "Found ${TOTAL_X86} x86 images, ${TOTAL_ARM} arm images. Total: ${TOTAL_IMAGES}"

          if [ "$TOTAL_IMAGES" -eq 0 ]; then
            echo "No changed images detected."
            echo "has_images=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_images=true" >> "$GITHUB_OUTPUT"

          # 初始化 Release Notes 表格
          cat <<EOF > release_notes.md
          ## Container Images Release

          本次 Release 包含以下保存的镜像压缩包文件（一个镜像对应一个独立文件）：

          | 镜像名称 | 架构 | 压缩文件 (Asset) | 压缩后大小 | 原始镜像大小 | SHA256 校验和 |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          EOF

          # 函数：处理单个镜像拉取、保存与打包
          process_single_image() {
            local raw_img="$1"
            local arch="$2"
            local platform="$3"
            local src_file="$4"

            echo "=============================================="
            echo "Processing: ${raw_img} [${arch}] (${platform})"
            echo "=============================================="

            # 清理特殊字符，构造安全的文件名前缀
            local clean_name=$(echo "${raw_img}" | sed -e 's|^docker.io/||' -e 's|^library/||' -e 's|[/:]|-|g' -e 's|[^a-zA-Z0-9._-]|-|g')
            local tar_filename="${clean_name}_${arch}.tar.gz"
            local tar_path="./dist/${tar_filename}"
            local sha_filename="${tar_filename}.sha256"
            local sha_path="./dist/${sha_filename}"

            echo "Pulling ${raw_img} with platform ${platform}..."
            docker pull --platform "${platform}" "${raw_img}"

            local image_id=$(docker inspect --format='{{.Id}}' "${raw_img}" 2>/dev/null || echo "unknown")
            local raw_size=$(docker inspect --format='{{.Size}}' "${raw_img}" 2>/dev/null || echo "0")
            local human_raw_size=$(numfmt --to=iec-i --suffix=B "${raw_size}" 2>/dev/null || echo "${raw_size} bytes")

            echo "Saving and compressing to ${tar_path}..."
            docker save "${raw_img}" | gzip -9 > "${tar_path}"

            (cd ./dist && sha256sum "${tar_filename}" > "${sha_filename}")
            local file_sha256=$(awk '{print $1}' "${sha_path}")
            local file_size=$(numfmt --to=iec-i --suffix=B $(stat -c%s "${tar_path}"))

            echo "Successfully exported: ${tar_filename} (${file_size})"

            # 追加到 Release Notes 表格
            echo "| \`${raw_img}\` | \`${arch}\` | \`${tar_filename}\` | ${file_size} | ${human_raw_size} | \`${file_sha256:0:16}...\` |" >> release_notes.md
          }

          # 处理 x86 镜像
          if [ -s "$X86_IMAGES" ]; then
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              process_single_image "$img" "x86" "linux/amd64" "image_x86.txt"
            done < "$X86_IMAGES"
          fi

          # 处理 ARM 镜像
          if [ -s "$ARM_IMAGES" ]; then
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              process_single_image "$img" "arm" "linux/arm64" "image_arm.txt"
            done < "$ARM_IMAGES"
          fi

          # 追加导入说明
          cat <<EOF >> release_notes.md

          ### 离线镜像导入命令
          \`\`\`bash
          # 下载对应的 .tar.gz 文件后，直接流式载入 Docker：
          gzip -dc <filename>.tar.gz | docker load

          # 或使用 docker load -i：
          docker load -i <filename>.tar.gz
          \`\`\`
          EOF

      - name: Publish All Images into One Release
        if: steps.process.outputs.has_images == 'true'
        run: |
          set -euo pipefail

          CUSTOM_TAG="${{ github.event.inputs.release_tag || '' }}"
          RUN_NUM="${{ github.run_number }}"
          DATE_STR=$(date -u +"%Y%m%d")
          TIME_STR=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # 若未指定自定义 tag，默认生成唯一递增版本标识
          if [ -n "${CUSTOM_TAG}" ]; then
            TAG="${CUSTOM_TAG}"
          else
            TAG="images-${DATE_STR}-r${RUN_NUM}"
          fi

          RELEASE_TITLE="Container Images [${DATE_STR}] (Run #${RUN_NUM})"

          echo "Publishing to Release Tag: ${TAG}"
          echo "Listing files in ./dist:"
          ls -lh ./dist

          # 检查 Release 是否已存在：存在则追加/更新，不存在则创建
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading new/updated assets..."
            gh release edit "${TAG}" --title "${RELEASE_TITLE}" --notes-file release_notes.md
            gh release upload "${TAG}" ./dist/* --clobber
          else
            echo "Creating new release: ${TAG}"
            gh release create "${TAG}" \
              ./dist/* \
              --target "${{ github.sha }}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release_notes.md
          fi

          echo "Successfully published all images as files into release ${TAG}!"
